[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnifix"
version = "1.0.0"
description = "Autonomous Multi-Agent SRE Remediation & Workflow Automation System"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OmniFix Team" }]
keywords = ["langraph", "mcp", "agents", "automation", "sre", "ai"]

dependencies = [
    # Core agent framework
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",

    # MCP
    "mcp>=1.0.0",
    "fastmcp>=0.4.0",

    # LLM providers (all optional, mock by default)
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-ollama>=0.2.0",
    "httpx>=0.27.0",

    # API layer
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "sse-starlette>=2.0.0",

    # Data & validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # State management
    "redis[hiredis]>=5.2.0",
    "aioredis>=2.0.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",

    # Document processing
    "easyocr>=1.7.0",
    "pillow>=11.0.0",
    "pypdf2>=3.0.0",
    "python-multipart>=0.0.12",

    # Browser automation
    "playwright>=1.49.0",

    # Utilities
    "structlog>=24.0.0",
    "rich>=13.9.0",
    "typer>=0.13.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "numpy>=2.1.0",
    "pandas>=2.2.0",

    # Async
    "asyncio>=3.4.3",
    "aiofiles>=24.0.0",
    "anyio>=4.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "coverage>=7.6.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
omnifix = "src.cli:app"
omnifix-mcp = "src.mcp_server.autoflow_mcp_server:main"
omnifix-api = "src.api.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
